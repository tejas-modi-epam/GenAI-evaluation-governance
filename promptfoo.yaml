description: "Compare prompt styles for cricket commentary"

prompts:
  - label: "Short Commentary"
    prompt: "Give a short, exciting cricket commentary for this match: {{query}}"

  - label: "Detailed Analysis"
    prompt: "Provide a detailed, professional cricket commentary and analysis for: {{query}}"

providers:
  - openai:gpt-4o-mini

tests:
  - vars:
      query: "India vs Pakistan World Cup 2023 group stage match"
